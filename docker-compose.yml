# Containerized Docker Edge Deployment for POLARIS Nav-OS & Microservices
version: '3.8'

services:
  polaris-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polaris_backend_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  polaris-frontend-dev:
    image: node:20-alpine
    container_name: polaris_frontend_app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host
