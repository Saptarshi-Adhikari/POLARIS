# Containerized Docker Edge Deployment for POLARIS Nav-OS & Microservices
version: '3.8'

services:
  # Production Combined Edge Container (Frontend + ML Service + Offline Data)
  polaris-edge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polaris_edge_deployment
    restart: unless-stopped
    ports:
      - "80:80"
      - "8001:8001"
    environment:
      - POLARIS_MODE=OFFLINE
      - POLARIS_API_BASE_URL=http://localhost:8001
      - POLARIS_CACHE_DIR=/app/data/cache
      - POLARIS_DATA_DIR=/app/data
      - POLARIS_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M

  # Optional Independent ML Microservice
  polaris-backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polaris_backend_service
    profiles: ["dev-backend"]
    restart: always
    ports:
      - "8002:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

